{{- if and .Values.snapshotStore.endpoint (not .Values.snapshotStore.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s-microvm-runner.storeSecretName" . }}
  labels:
    {{- include "service-base.labels" . | nindent 4 }}
type: Opaque
stringData:
  SNAPSHOT_STORE_ACCESS_KEY: {{ .Values.snapshotStore.accessKey | quote }}
  SNAPSHOT_STORE_SECRET_KEY: {{ .Values.snapshotStore.secretKey | quote }}
{{- end }}
